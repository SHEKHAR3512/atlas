version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: atlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas_local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas} -d ${POSTGRES_DB:-atlas}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: atlas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  atlas-api:
    build:
      context: .
      dockerfile: services/atlas/Dockerfile
    container_name: atlas-api
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas_local}@postgres:5432/${POSTGRES_DB:-atlas}
      - REDIS_URL=redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: ["uvicorn", "services.atlas.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  atlas-worker:
    build:
      context: .
      dockerfile: services/atlas/Dockerfile
    container_name: atlas-worker
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas_local}@postgres:5432/${POSTGRES_DB:-atlas}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: ["python", "-m", "services.atlas.workers.runner"]

  atlas-scheduler:
    build:
      context: .
      dockerfile: services/atlas/Dockerfile
    container_name: atlas-scheduler
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER:-atlas}:${POSTGRES_PASSWORD:-atlas_local}@postgres:5432/${POSTGRES_DB:-atlas}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      atlas-api:
        condition: service_started
    volumes:
      - .:/app
    command: ["python", "-m", "services.atlas.core.scheduler"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: atlas-web
    restart: unless-stopped
    env_file: .env
    environment:
      - API_HOST=atlas-api
      - API_PORT=8000
    ports:
      - "3000:3000"
    depends_on:
      - atlas-api

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: atlas-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:10.4.0
    container_name: atlas-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
